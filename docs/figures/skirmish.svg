 stroke-width="2.5"/><circle cx="268.5" cy="134.5" r="4.0" fill="none" stroke="#ffd166" stroke-width="2.5"/><circle cx="268.5" cy="134.5" r="1.3" fill="#ffd166"/><rect x="336.0" y="100.0" width="14.0" height="14.0" rx="3.0" fill="#de4a4f"/><text x="358.0" y="111.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">Gates: only the enemy&#x27;s units pass; its base cannot be hurt from outside</text><rect x="336.0" y="140.0" width="14.0" height="14.0" rx="3.0" fill="#b77cff"/><text x="358.0" y="151.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">A portal: a unit sent onto it comes out at the other end, inside</text><rect x="336.0" y="180.0" width="14.0" height="14.0" rx="3.0" fill="#ffd166"/><text x="358.0" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">A switch: stood on for ten seconds, it opens the ring it is wired to</text><rect x="336.0" y="220.0" width="14.0" height="14.0" rx="3.0" fill="#8b877c"/><text x="358.0" y="231.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">The middle: held alone for a minute, it wins the battle outright</text><text x="336.0" y="272.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="start">Battle 1 shows the middle&#x27;s meter; battles 2 and 3 start you</text><text x="336.0" y="288.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="start">inside a ring with a portal, then a switch, as the only way out.</text><text x="336.0" y="304.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="start">After that nothing is explained. A bot that never learned</text><text x="336.0" y="320.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="start">the mechanics wins 0 of 14 battles.</text></svg>
