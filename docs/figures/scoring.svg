<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Scoring: par divided by actions; zero if the budget runs out"><rect x="0.0" y="0.0" width="900.0" height="300.0" rx="16.0" fill="#15141c"/><text x="32.0" y="46.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ecebf2" text-anchor="start">How a level is scored</text><text x="32.0" y="70.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">score = par ÷ actions. Par is the fewest actions possible (found by searching every move).</text><path d="M210 118 v-6 H387 v6" fill="none" stroke="#f0b443" stroke-width="1.6"/><text x="298.5" y="106.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ecebf2" text-anchor="middle">par = 10</text><text x="32.0" y="140.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="start">Done in 10 actions</text><rect x="210.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="228.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="246.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="264.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="282.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="300.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="318.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="336.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="354.0" y="128.0" width="15.0" height="15.0" rx="3.0" fill="#4c8ff7" opacity="1.00"/><rect x="372.0" y="128.0" width="15.0" height="15