<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 308" width="900" height="308" role="img" aria-label="Scoring: par divided by your time; zero if you never get in"><rect x="0.0" y="0.0" width="900.0" height="308.0" rx="16.0" fill="#15141c"/><text x="32.0" y="46.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ecebf2" text-anchor="start">How a battle is scored</text><text x="32.0" y="70.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">score = par ÷ your time. Par: the fastest win 216 scripted strategies found, by one that knows the mechanics.</text><path d="M220 118v-6H461.7v6" fill="none" stroke="#f0b443" stroke-width="1.6"/><text x="340.8" y="106.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#ecebf2" text-anchor="middle">par = 1:03</text><text x="32.0" y="140.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="start">Won in 1:03</text><rect x="220.0" y="128.0" width="241.7" height="15.0" rx="4.0" fill="#4c8ff7"/><text x="868.0" y="141.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ecebf2" text-anchor="end">100%</text><text x="32.0" y="184.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="start">Won in 2:06</text><rect x="220.0" y="172.0" width="483.3" height="15.0" rx="4.0" fill="#4c8ff7"/><text x="868.0" y="185.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ecebf2" text-anchor="end">50%</text><text x="32.0" y="228.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="start">Never got in</text><rect x="220.0" y="216.0" width="580.0" height="15.0" rx="4.0" fill="#5d5a6b" opacity=".55"/><text x="868.0" y="229.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ecebf2" text-anchor="end">0%</text><text x="32.0" y="274.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">Six minutes a battle; out of time is a draw and scores 0. A phase scores the mean of its battles; the run the mean of the phases.</text></svg>
