<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Gated worlds: each level lights a pair of glyphs and the next level demands it unlit; an agent that did not learn the level before scores 0"><rect x="0.0" y="0.0" width="900.0" height="300.0" rx="16.0" fill="#15141c"/><text x="32.0" y="46.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ecebf2" text-anchor="start">Gated worlds</text><text x="32.0" y="70.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">Every level is locked by the lesson of the one before it: pass it and the learning is proven</text><rect x="32.0" y="96.0" width="236.0" height="150.0" rx="12.0" fill="#0e0d13"/><rect x="32.0" y="96.0" width="6.0" height="150.0" rx="3.0" fill="#4c8ff7"/><text x="50.0" y="120.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ecebf2" text-anchor="start">Level n: the lesson</text><rect x="50.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="65.0" cy="151.0" r="2.7" fill="#f3eefc"/><rect x="90.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="99.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="111.0" cy="157.0" r="2.7" fill="#f3eefc"/><rect x="130.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="139.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="145.0" cy="151.0" r="2.7" fill="#f3eefc"/><circle cx="151.0" cy="157.0" r="2.7" fill="#f3eefc"/><rect x="170.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#9b7fe0"/><circle cx="179.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="191.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="179.0" cy="157.0" r="2.7" fill="#f3eefc"/><circle cx="191.0" cy="157.0" r="2.7" fill="#f3eefc"/><rect x="50.0" y="180.0" width="150.0" height="8.0" rx="4.0" fill="#2c2a36"/><rect x="50.0" y="180.0" width="110.0" height="8.0" rx="4.0" fill="#4c8ff7"/><text x="208.0" y="188.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#b4afc4" text-anchor="start">meter</text><text x="50.0" y="210.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">pair 3 then 4, lit</text><text x="50.0" y="230.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8f8aa0" text-anchor="start">holding the lit pair opens this level</text><line x1="276.0" y1="171.0" x2="316.0" y2="171.0" stroke="#8f8aa0" stroke-width="1.6" stroke-linecap="round"/><polygon points="316.0,171.0 309.7,174.0 309.7,168.0" fill="#8f8aa0"/><rect x="320.0" y="140.0" width="90.0" height="62.0" rx="10.0" fill="#1d1b25"/><text x="365.0" y="166.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="middle">other</text><text x="365.0" y="184.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="middle">worlds…</text><line x1="416.0" y1="171.0" x2="456.0" y2="171.0" stroke="#8f8aa0" stroke-width="1.6" stroke-linecap="round"/><polygon points="456.0,171.0 449.7,174.0 449.7,168.0" fill="#8f8aa0"/><rect x="460.0" y="96.0" width="236.0" height="150.0" rx="12.0" fill="#0e0d13"/><rect x="460.0" y="96.0" width="6.0" height="150.0" rx="3.0" fill="#d9534f"/><text x="478.0" y="120.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ecebf2" text-anchor="start">Level n+1: the gate</text><rect x="478.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="487.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="493.0" cy="151.0" r="2.7" fill="#f3eefc"/><circle cx="499.0" cy="157.0" r="2.7" fill="#f3eefc"/><rect x="518.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="533.0" cy="151.0" r="2.7" fill="#f3eefc"/><rect x="558.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="567.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="579.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="567.0" cy="157.0" r="2.7" fill="#f3eefc"/><circle cx="579.0" cy="157.0" r="2.7" fill="#f3eefc"/><rect x="598.0" y="136.0" width="30.0" height="30.0" rx="3.0" fill="#6b5d8c"/><circle cx="607.0" cy="145.0" r="2.7" fill="#f3eefc"/><circle cx="619.0" cy="157.0" r="2.7" fill="#f3eefc"/><text x="478.0" y="188.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8f8aa0" text-anchor="start">no meter, no examples</text><text x="478.0" y="210.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">demands 3 then 4, unlit</text><text x="478.0" y="230.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8f8aa0" text-anchor="start">and lights its own pair for level n+2</text><text x="720.0" y="128.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">fresh agent</text><rect x="720.0" y="136.0" width="120.0" height="10.0" rx="5.0" fill="#2c2a36"/><text x="848.0" y="145.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d9534f" text-anchor="start">0%</text><text x="720.0" y="176.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">agent that learned level n</text><rect x="720.0" y="184.0" width="120.0" height="10.0" rx="5.0" fill="#2c2a36"/><rect x="720.0" y="184.0" width="120.0" height="10.0" rx="5.0" fill="#4c8ff7"/><text x="848.0" y="193.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#4c8ff7" text-anchor="start">wins</text><text x="720.0" y="226.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8f8aa0" text-anchor="start">Weights track: context is wiped</text><text x="720.0" y="242.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8f8aa0" text-anchor="start">between visits, so only learning</text><text x="720.0" y="258.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#8f8aa0" text-anchor="start">that reached the weights passes.</text><text x="32.0" y="276.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">Solvable levels still measure how much carries over; gated levels prove that something did.</text></svg>
