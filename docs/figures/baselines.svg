<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 394" width="900" height="394" role="img" aria-label="Bar chart of baseline scores by phase for random keys and the explorer"><rect x="0.0" y="0.0" width="900.0" height="394.0" rx="16.0" fill="#15141c"/><text x="32.0" y="46.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#ecebf2" text-anchor="start">Baseline scores on practice-v0</text><text x="32.0" y="70.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">Higher is better. The solver, which reads the rules from the code, scores 100% everywhere.</text><rect x="32.0" y="88.0" width="12.0" height="12.0" rx="3.0" fill="#3987e5"/><text x="50.0" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ecebf2" text-anchor="start">random keys</text><rect x="139.4" y="88.0" width="12.0" height="12.0" rx="3.0" fill="#d95926"/><text x="157.4" y="99.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#ecebf2" text-anchor="start">explorer (forgets each level)</text><line x1="130.0" y1="120" x2="130.0" y2="326" stroke="#2c2a36" stroke-width="1"/><text x="130.0" y="342.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="middle">0%</text><line x1="353.3" y1="120" x2="353.3" y2="326" stroke="#2c2a36" stroke-width="1"/><text x="353.3" y="342.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="middle">5%</text><line x1="576.7" y1="120" x2="576.7" y2="326" stroke="#2c2a36" stroke-width="1"/><text x="576.7" y="342.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="middle">10%</text><line x1="800.0" y1="120" x2="800.0" y2="326" stroke="#2c2a36" stroke-width="1"/><text x="800.0" y="342.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#8f8aa0" text-anchor="middle">15%</text><text x="116.0" y="148.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="end">Learn</text><path d="M130 128 H277.0 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#3987e5"/><text x="287.0" y="139.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">3.4%</text><path d="M130 144 H722.7 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#d95926"/><text x="732.7" y="155.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">13.4%</text><text x="116.0" y="200.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="end">Remix</text><path d="M130 180 H130.0 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#3987e5"/><text x="138.2" y="191.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">0.05%</text><path d="M130 196 H316.7 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#d95926"/><text x="326.7" y="207.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">4.3%</text><text x="116.0" y="252.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#ecebf2" text-anchor="end">Return</text><path d="M130 232 H137.2 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#3987e5"/><text x="147.2" y="243.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">0.25%</text><path d="M130 248 H377.9 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#d95926"/><text x="387.9" y="259.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">5.6%</text><text x="116.0" y="304.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#ecebf2" text-anchor="end">Overall</text><path d="M130 284 H180.9 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#3987e5"/><text x="190.9" y="295.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">1.2%</text><path d="M130 300 H472.6 q4 0 4 4 v6 q0 4 -4 4 H130 Z" fill="#d95926"/><text x="482.6" y="311.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#b4afc4" text-anchor="start">7.8%</text><text x="32.0" y="370.0" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#b4afc4" text-anchor="start">The explorer gains nothing from remixes or return visits: it remembers nothing between levels. A continual learner should.</text></svg>
