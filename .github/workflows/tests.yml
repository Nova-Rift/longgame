name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[gym]"
      - name: Install the ARC-AGI toolkit's types where supported (Python 3.12+)
        run: python -m pip install arcengine || echo "arcengine needs Python 3.12+; its test is skipped"
      - name: Test (against the installed package)
        run: |
          cd tests
          python -m unittest discover -s . -t . -v
